<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 400px;">
      <h2 class="mb-4 text-center">Login</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div id="alerts">
            {% for category, message in messages %}
              <div class="alert alert-{{ 'success' if category=='success' else 'danger' if category=='error' else 'info' }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Login</button>
      </form>
      <p class="mt-3 text-center">Don’t have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>
  </div>

  <script>
  // Auto-hide alerts after 3 seconds
    setTimeout(() => {
        document.querySelectorAll('#alerts .alert').forEach(alert => {
        alert.classList.add('fade');
        alert.classList.remove('show');
        // Remove element after Bootstrap's fade transition (~150ms)
        alert.addEventListener('transitionend', () => alert.remove());
        });
    }, 3000); // keep visible for 3 seconds before fading
  </script>
</body>
</html>
